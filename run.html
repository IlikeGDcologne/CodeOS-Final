<!doctype html>
<html>
  <head>
    <title>CodeOS Runner</title>

    <style>
      body {
        background: #111;
        color: white;
        font-family: Inter, sans-serif;
        padding: 30px;
      }

      #loading {
        position: static;

        transform: none;

        font-size: 100px;

        animation: dance 0.4s infinite alternate;

        user-select: none;
      }

      @keyframes dance {
        from {
          transform: rotate(-20deg) scale(1);
        }

        to {
          transform: rotate(20deg) scale(1.15);
        }
      }

      #output {
        font-size: 24px;

        display: none;
      }

      #loadingScreen {
        position: fixed;

        inset: 0;

        background: #111;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        gap: 30px;

        z-index: 999;
      }

      #loading {
        font-size: 100px;

        animation: dance 0.4s infinite alternate;

        user-select: none;
      }

      #loadingText {
        margin: 0;

        font-size: 34px;
      }

      #loadingBar {
        width: 420px;

        height: 22px;

        background: #333;

        border-radius: 999px;

        overflow: hidden;

        border: 2px solid #666;
      }

      #loadingFill {
        width: 0%;

        height: 100%;

        background: lime;
      }

      #output {
        display: none;

        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <div id="loadingScreen">
      <div id="loading">👾</div>

      <h1 id="loadingText">👾 Booting CodeOS...</h1>

      <div id="loadingBar">
        <div id="loadingFill"></div>
      </div>
    </div>

    <div id="output"></div>
    <script src="run.js"></script>
  </body>
</html>
